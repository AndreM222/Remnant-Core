name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

env:
    CARGO_TERM_COLOR: always
    RUST_BACKTRACE: 1

jobs:
    format:
        name: Format
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: rustfmt

            - name: Cache Cargo
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Check Formatting
              run: cargo fmt --all -- --check

    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy

            - name: Cache Cargo
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Run Clippy
              run: |
                  cargo clippy --all-targets --all-features -- \
                    -D clippy::unwrap_used \
                    -D clippy::expect_used \
                    -W clippy::pedantic \
                    -A clippy::module_name_repetitions

    typos:
        name: Spell Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Check Typos
              uses: crate-ci/typos@v1.51.1
              with:
                  config: typos.toml

    commitlint:
        name: Commit Messages
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Validate Commit Messages
              uses: wagoid/commitlint-github-action@v6
              with:
                  configFile: commitlint.config.mjs

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [format, clippy, typos, commitlint]
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable

            - name: Cache Cargo
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                      target/
                  key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

            - name: Build
              run: cargo build --all
