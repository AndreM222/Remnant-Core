# git-cliff configuration for remnant-core
# Generates CHANGELOG.md from Conventional Commits automatically

[changelog]
# Template for the full changelog
header = """
# Changelog\n
All notable changes to remnant-core are documented here.\n
"""

body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%B %d, %Y") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**BREAKING** {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/Remnant-Browser/Remnant-Core/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""

footer = """
---
*Generated automatically from commit history.*
"""

trim = true

[git]
# Only include these commit types in the changelog
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(deps\\)", group = "Dependencies" },
    { message = "^chore", skip = true },
    { message = "^ci", skip = true },
    { message = "^style", skip = true },
]

# Show breaking changes prominently
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"
